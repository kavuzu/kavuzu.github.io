<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Global Trade Atlas — bilingual interactive trade and supply-chain research.">
<title>Global Trade Atlas</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#030712;color:#f6f9fd;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:grid;place-items:center}
#boot{text-align:center;padding:24px}
#boot b{display:block;font-size:14px;letter-spacing:.25em}
#boot span{display:block;margin-top:12px;color:#8393a8;font-size:11px}
</style>
</head>
<body>
<div id="boot"><b>GLOBAL TRADE ATLAS</b><span>Loading research platform…</span></div>
<script>
const GTA_PARTS=['assets/atlas/part-001.txt', 'assets/atlas/part-002.txt', 'assets/atlas/part-003.txt', 'assets/atlas/part-004.txt', 'assets/atlas/part-005.txt', 'assets/atlas/part-006.txt', 'assets/atlas/part-007.txt', 'assets/atlas/part-008.txt', 'assets/atlas/part-009.txt', 'assets/atlas/part-010.txt', 'assets/atlas/part-011.txt', 'assets/atlas/part-012.txt', 'assets/atlas/part-013.txt', 'assets/atlas/part-014.txt', 'assets/atlas/part-015.txt', 'assets/atlas/part-016.txt', 'assets/atlas/part-017.txt', 'assets/atlas/part-018.txt', 'assets/atlas/part-019.txt', 'assets/atlas/part-020.txt', 'assets/atlas/part-021.txt', 'assets/atlas/part-022.txt', 'assets/atlas/part-023.txt', 'assets/atlas/part-024.txt', 'assets/atlas/part-025.txt', 'assets/atlas/part-026.txt', 'assets/atlas/part-027.txt', 'assets/atlas/part-028.txt', 'assets/atlas/part-029.txt'];
const GTA_REPO='kavuzu/kavuzu.github.io';
async function currentBuildVersion(){
  try{
    const r=await fetch('https://api.github.com/repos/'+GTA_REPO+'/tags?per_page=100',{cache:'no-store'});
    if(!r.ok)throw new Error('GitHub tags unavailable');
    const tags=await r.json();
    const versions=tags.map(x=>x.name).filter(x=>/^v16\.0\.\d+$/.test(x)).sort((a,b)=>Number(b.split('.').pop())-Number(a.split('.').pop()));
    return versions[0]||'v16';
  }catch(e){return 'v16';}
}
async function bootAtlas(){
  if(!('DecompressionStream' in window))throw new Error('Please use a current version of Safari, Chrome, Edge or Firefox.');
  const [version,chunks]=await Promise.all([
    currentBuildVersion(),
    Promise.all(GTA_PARTS.map(async path=>{
      const r=await fetch(path,{cache:'force-cache'});
      if(!r.ok)throw new Error('Failed to load Atlas payload: '+path+' ('+r.status+')');
      return r.text();
    }))
  ]);
  const binary=atob(chunks.join('').replace(/\s+/g,''));
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  let html=await new Response(stream).text();
  const versionPattern=/const ATLAS_VERSION=Object\.freeze\(\{major:16,label:'[^']+',name:\{en:'Gold Master',ru:'Финальная версия'\},buildDate:'[^']+'\}\);/;
  const today=new Date().toISOString().slice(0,10);
  const replacement="const ATLAS_VERSION=Object.freeze({major:16,label:'"+version+"',name:{en:'Gold Master',ru:'Финальная версия'},buildDate:'"+today+"'});";
  if(!versionPattern.test(html))throw new Error('Atlas version block was not found.');
  html=html.replace(versionPattern,replacement).replaceAll('v16 · Gold Master',version+' · Gold Master');
  document.open();
  document.write(html);
  document.close();
}
bootAtlas().catch(err=>{
  console.error(err);
  const el=document.getElementById('boot');
  if(el)el.innerHTML='<b>GLOBAL TRADE ATLAS</b><span>Unable to load the Atlas. '+String(err.message||err)+'</span>';
});
</script>
</body>
</html>
